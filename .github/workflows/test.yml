name: ProcureAI checks
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AI_WORKER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: npm install
        working-directory: tests
      - run: npm test
        working-directory: tests
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: Browser checks in disposable database
        run: |
          python ops/serve_ui_test.py > /tmp/procure-ui.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8766/health/ready && break || sleep 1; done
          cd tests
          PROCURE_TEST_BROWSER=chromium npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-browser-evidence
          path: evidence/
